name: Publish

# Publishing is triggered by the tag, not by a branch push, so a release is
# always cut from the exact commit that carries the version in package.json.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is exchanged for a
      # signed attestation that links the tarball to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Fail before the install, typecheck, tests and build if this version is
      # already on the registry, so a re-run of a tag that did publish only
      # costs one API call instead of the whole suite.
      - name: Check that the version is not already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@oxog/scrollex@${version}" version >/dev/null 2>&1; then
            echo "::error::@oxog/scrollex@${version} is already published on npm. Bump the version and tag the new commit instead of re-running this tag."
            exit 1
          fi
          echo "@oxog/scrollex@${version} is not on npm yet."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag ${GITHUB_REF_NAME} -> ${tag}, package.json -> ${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      # dist/ is never committed, so the build above is what gets packed. The
      # build and tests already ran as their own steps, so lifecycle scripts are
      # off here: prepublishOnly would only run them a second time.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
