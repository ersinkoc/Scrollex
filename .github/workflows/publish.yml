name: Publish

# A release is triggered by the tag, not by a branch push, so it is always cut
# from the exact commit that carries the version in package.json.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is exchanged for a signed
      # attestation that links the tarball to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Both guards run before the install, typecheck, tests and build, so a
      # mistyped tag or a version that is already on npm costs one API call
      # instead of the whole suite. `npm view` fails open: a network error looks
      # like a missing version, and the publish step then reports the real one.
      - name: Check the tag and the version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
          if npm view "@oxog/scrollex@${version}" version >/dev/null 2>&1; then
            echo "::error::@oxog/scrollex@${version} is already published on npm. Bump the version and tag the new commit instead of re-running this tag."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} matches package.json and ${version} is not on npm yet."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # dist/ is never committed, so the build above is what gets packed; the
      # build and tests already ran as their own steps, so lifecycle scripts are
      # off here. A prerelease publishes under the identifier it carries
      # (1.0.4-beta.0 -> beta) and anything else goes to latest, which a
      # prerelease must never be able to move.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          dist_tag=latest
          if [ "$version" != "${version%%-*}" ]; then
            prerelease="${version#*-}"
            dist_tag="${prerelease%%.*}"
            if ! printf '%s' "$dist_tag" | grep -Eq '^[a-z][a-z0-9-]*$'; then
              echo "::error::Prerelease ${version} needs a named dist-tag: tag a version like 1.0.4-beta.0."
              exit 1
            fi
          fi
          echo "Publishing ${version} to dist-tag ${dist_tag}."
          npm publish --provenance --access public --ignore-scripts --tag "$dist_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
